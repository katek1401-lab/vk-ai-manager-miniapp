<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VK AI Manager</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .card {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 22px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    #status {
      margin: 16px 0;
      line-height: 1.5;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      background: #2688eb;
      color: white;
      margin-top: 12px;
    }

    button:disabled {
      opacity: 0.5;
    }

    #errorBox {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      background: #f1f3f6;
    }

    #errorText {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>VK AI Manager</h1>

    <div id="status">Запускаю VK Mini App…</div>

    <button id="publishButton" disabled>
      Проверить публикацию
    </button>

    <div id="errorBox">
      <strong>Ответ VK:</strong>
      <div id="errorText"></div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const publishButton = document.getElementById("publishButton");
    const errorBox = document.getElementById("errorBox");
    const errorText = document.getElementById("errorText");

    function showError(error) {
      let text;

      try {
        text = JSON.stringify(error, null, 2);
      } catch (_) {
        text = String(error);
      }

      if (!text || text === "{}") {
        text =
          "message: " + (error?.message || "нет") + "\n" +
          "name: " + (error?.name || "нет") + "\n" +
          "type: " + (error?.type || "нет");
      }

      errorText.textContent = text;
      errorBox.style.display = "block";
    }

    async function initApp() {
      try {
        await window.vkBridge.send("VKWebAppInit");

        statusEl.textContent = "✅ VK AI Manager запущен";
        publishButton.disabled = false;
      } catch (error) {
        statusEl.textContent = "❌ Ошибка запуска";
        showError(error);
      }
    }

    async function testPublish() {
      publishButton.disabled = true;
      errorBox.style.display = "none";
      statusEl.textContent = "Проверяю публикацию…";

      try {
        const result = await window.vkBridge.send(
          "VKWebAppShowWallPostBox",
          {
            message: "Тест VK AI Manager"
          }
        );

        statusEl.textContent =
          "✅ VK разрешил вызов окна публикации";

        if (result) {
          errorText.textContent =
            JSON.stringify(result, null, 2);
          errorBox.style.display = "block";
        }

      } catch (error) {
        statusEl.textContent =
          "❌ VK вернул ошибку";
        showError(error);
      } finally {
        publishButton.disabled = false;
      }
    }

    publishButton.addEventListener("click", testPublish);

    initApp();
  </script>
</body>
</html>

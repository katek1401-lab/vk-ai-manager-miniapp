<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VK AI Manager — диагностика</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f2f3f5;
      color: #111;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 16px;
    }

    h1 {
      margin-top: 0;
    }

    #status {
      margin-top: 16px;
      padding: 14px;
      background: #f2f3f5;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>VK AI Manager</h1>

    <p>
      Диагностика запуска.
      Ничего публиковаться не будет.
    </p>

    <div id="status">Проверяю...</div>
  </div>

  <script>
    const status = document.getElementById("status");
    const bridge = window.vkBridge;

    const params = new URLSearchParams(window.location.search);

    const vkAppId = params.get("vk_app_id");
    const vkPlatform = params.get("vk_platform");
    const vkUserId = params.get("vk_user_id");
    const sign = params.get("sign");

    let isWebView = false;
    let isIframe = false;
    let isEmbedded = false;

    try {
      if (bridge) {
        isWebView = bridge.isWebView();
        isIframe = bridge.isIframe();
        isEmbedded = bridge.isEmbedded();
      }
    } catch (e) {
      // Просто продолжаем диагностику
    }

    let device = "неизвестно";
    const ua = navigator.userAgent || "";

    if (/android/i.test(ua)) {
      device = "Android";
    } else if (/iphone|ipad|ipod/i.test(ua)) {
      device = "iPhone / iOS";
    }

    let result = "";

    result += "Устройство: " + device + "\n\n";

    result += "VK Bridge загружен: " +
      (bridge ? "✅ да" : "❌ нет") + "\n";

    result += "VK WebView: " +
      (isWebView ? "✅ да" : "❌ нет") + "\n";

    result += "Встроено в VK: " +
      (isEmbedded ? "✅ да" : "❌ нет") + "\n";

    result += "Открыто во фрейме: " +
      (isIframe ? "✅ да" : "❌ нет") + "\n\n";

    result += "vk_app_id: " +
      (vkAppId || "❌ нет") + "\n";

    result += "vk_platform: " +
      (vkPlatform || "❌ нет") + "\n";

    result += "vk_user_id: " +
      (vkUserId ? "✅ есть" : "❌ нет") + "\n";

    result += "sign: " +
      (sign ? "✅ есть" : "❌ нет") + "\n\n";

    if (vkAppId && vkPlatform && sign) {
      result +=
        "✅ VK передал параметры Mini App.\n" +
        "Запуск похож на правильный.";
    } else {
      result +=
        "⚠️ Не хватает параметров Mini App.\n" +
        "Похоже, страница открывается не так, как должна.";
    }

    status.textContent = result;
  </script>
</body>
</html>

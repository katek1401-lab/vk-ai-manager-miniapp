<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VK AI Manager — проверка</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f2f3f5;
      color: #111;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 16px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      background: #447bba;
      color: white;
    }

    #status {
      margin-top: 18px;
      padding: 14px;
      background: #f2f3f5;
      border-radius: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Проверка VK</h1>

    <p>
      Сейчас ничего публиковаться не будет.
      Мы только проверим, доступно ли окно публикации на этом устройстве.
    </p>

    <button id="check">
      Проверить публикацию
    </button>

    <div id="status">
      Нажми кнопку проверки.
    </div>
  </div>

  <script>
    const bridge = window.vkBridge;
    const status = document.getElementById("status");

    async function init() {
      try {
        await bridge.send("VKWebAppInit");
        status.textContent = "VK Mini App запущено. Можно проверять.";
      } catch (error) {
        status.textContent = "Ошибка запуска VK Mini App.";
      }
    }

    document.getElementById("check").onclick = async function () {
      status.textContent = "Проверяю...";

      try {
        const supported = await bridge.supportsAsync(
          "VKWebAppShowWallPostBox"
        );

        if (supported) {
          status.textContent =
            "✅ Метод публикации поддерживается на этом устройстве.";
        } else {
          status.textContent =
            "❌ Метод публикации НЕ поддерживается на этом устройстве.";
        }
      } catch (error) {
        status.textContent =
          "⚠️ Не удалось выполнить проверку.\n" +
          String(error);
      }
    };

    init();
  </script>
</body>
</html>

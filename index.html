<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VK AI Manager</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f3f5;
      color: #111;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      margin: 8px 0;
      line-height: 1.45;
    }

    #status {
      margin-top: 18px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>VK AI Manager</h1>
      <p>Мини-приложение загружено.</p>
      <p id="status">Запускаю VK Bridge…</p>
    </div>
  </div>

  <script>
    async function startApp() {
      const status = document.getElementById("status");

      try {
        if (!window.vkBridge) {
          status.textContent = "Ошибка: VK Bridge не загрузился";
          return;
        }

        await window.vkBridge.send("VKWebAppInit");

        status.textContent = "✅ VK AI Manager запущен";
      } catch (error) {
        status.textContent =
          "Ошибка запуска VK Bridge: " +
          (error && error.message ? error.message : String(error));
      }
    }

    startApp();
  </script>
</body>
</html>

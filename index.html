<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VK AI Manager</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .card {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    #status {
      margin: 16px 0;
      line-height: 1.5;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      background: #2688eb;
      color: white;
      margin-top: 12px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .note {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.45;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>VK AI Manager</h1>

    <div id="status">
      Запускаю VK Mini App…
    </div>

    <button id="publishButton" disabled>
      Тест публикации
    </button>

    <div class="note">
      Кнопка только откроет стандартное окно публикации VK.
      Ничего не будет опубликовано без вашего подтверждения.
    </div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const publishButton = document.getElementById("publishButton");

    async function initApp() {
      try {
        await window.vkBridge.send("VKWebAppInit");

        statusEl.textContent = "✅ VK AI Manager запущен";
        publishButton.disabled = false;
      } catch (error) {
        statusEl.textContent =
          "❌ Ошибка запуска: " +
          (error?.message || String(error));
      }
    }

    async function testPublish() {
      publishButton.disabled = true;
      statusEl.textContent = "Открываю окно публикации VK…";

      try {
        const result = await window.vkBridge.send(
          "VKWebAppShowWallPostBox",
          {
            message: "Тест VK AI Manager"
          }
        );

        if (result && result.post_id) {
          statusEl.textContent =
            "✅ Тестовая запись опубликована. ID: " + result.post_id;
        } else {
          statusEl.textContent =
            "Окно публикации закрыто.";
        }
      } catch (error) {
        statusEl.textContent =
          "❌ Ошибка: " +
          (error?.message || String(error));
      } finally {
        publishButton.disabled = false;
      }
    }

    publishButton.addEventListener("click", testPublish);

    initApp();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VK AI Manager</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f2f3f5;
      color: #111;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 16px;
    }

    h1 {
      margin-top: 0;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      background: #447bba;
      color: white;
    }

    #status {
      margin-top: 18px;
      padding: 14px;
      background: #f2f3f5;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>VK AI Manager</h1>

    <p>
      Проверяем связь с VK.
      Ничего публиковаться не будет.
    </p>

    <button id="check">
      Проверить публикацию
    </button>

    <div id="status">
      Подготовка...
    </div>
  </div>

  <script>
    const bridge = window.vkBridge;
    const status = document.getElementById("status");
    const checkButton = document.getElementById("check");

    function timeout(ms) {
      return new Promise((_, reject) => {
        setTimeout(() => {
          reject(new Error("TIMEOUT"));
        }, ms);
      });
    }

    async function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        timeout(ms)
      ]);
    }

    function getPlatformInfo() {
      let platform = "неизвестно";

      const ua = navigator.userAgent || "";

      if (/android/i.test(ua)) {
        platform = "Android";
      } else if (/iphone|ipad|ipod/i.test(ua)) {
        platform = "iPhone / iOS";
      }

      return platform;
    }

    async function init() {
      if (!bridge) {
        status.textContent =
          "❌ VK Bridge не загрузился.";
        return;
      }

      const platform = getPlatformInfo();

      status.textContent =
        "Устройство: " + platform + "\nПроверяю связь с VK...";

      try {
        await withTimeout(
          bridge.send("VKWebAppInit"),
          5000
        );

        status.textContent =
          "✅ Связь с VK есть.\n" +
          "Устройство: " + platform + "\n" +
          "Можно нажать «Проверить публикацию».";

      } catch (error) {
        if (error.message === "TIMEOUT") {
          status.textContent =
            "⚠️ VK не ответил на запуск приложения за 5 секунд.\n" +
            "Устройство: " + platform;
        } else {
          status.textContent =
            "⚠️ Ошибка запуска VK Mini App.\n" +
            String(error);
        }
      }
    }

    checkButton.onclick = async function () {
      const platform = getPlatformInfo();

      status.textContent =
        "Проверяю поддержку публикации...\n" +
        "Устройство: " + platform;

      try {
        const supported = await withTimeout(
          bridge.supportsAsync("VKWebAppShowWallPostBox"),
          5000
        );

        if (supported) {
          status.textContent =
            "✅ Публикация поддерживается.\n" +
            "Устройство: " + platform + "\n\n" +
            "Пока ничего не опубликовано.";
        } else {
          status.textContent =
            "❌ Публикация через VK Bridge не поддерживается.\n" +
            "Устройство: " + platform;
        }

      } catch (error) {
        if (error.message === "TIMEOUT") {
          status.textContent =
            "⚠️ VK не ответил на проверку за 5 секунд.\n" +
            "Устройство: " + platform + "\n\n" +
            "Приложение больше не будет висеть бесконечно.";
        } else {
          status.textContent =
            "⚠️ Ошибка проверки.\n" +
            "Устройство: " + platform + "\n\n" +
            String(error);
        }
      }
    };

    init();
  </script>
</body>
</html>

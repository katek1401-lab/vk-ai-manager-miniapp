<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VK AI Manager</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .card {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    #status {
      margin: 16px 0;
      line-height: 1.5;
    }

    #user {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #f1f3f6;
      border-radius: 16px;
    }

    #avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      background: #2688eb;
      color: white;
      margin-top: 12px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>VK AI Manager</h1>

    <div id="status">
      Запускаю VK Mini App…
    </div>

    <div id="user">
      <img id="avatar" alt="Фото профиля">

      <div>
        <strong id="name"></strong>
      </div>

      <div id="userid"></div>
    </div>

    <button id="userButton" disabled>
      Получить данные профиля
    </button>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const userEl = document.getElementById("user");
    const avatarEl = document.getElementById("avatar");
    const nameEl = document.getElementById("name");
    const userIdEl = document.getElementById("userid");
    const userButton = document.getElementById("userButton");

    async function initApp() {
      try {
        await window.vkBridge.send("VKWebAppInit");

        statusEl.textContent = "✅ VK AI Manager запущен";
        userButton.disabled = false;
      } catch (error) {
        statusEl.textContent =
          "❌ Не удалось запустить VK Bridge: " +
          (error?.message || String(error));
      }
    }

    async function getUser() {
      userButton.disabled = true;
      statusEl.textContent = "Получаю данные профиля…";

      try {
        const user = await window.vkBridge.send("VKWebAppGetUserInfo");

        nameEl.textContent =
          `${user.first_name || ""} ${user.last_name || ""}`.trim();

        userIdEl.textContent =
          user.id ? `VK ID: ${user.id}` : "";

        if (user.photo_200) {
          avatarEl.src = user.photo_200;
          avatarEl.style.display = "block";
        } else {
          avatarEl.style.display = "none";
        }

        userEl.style.display = "block";
        statusEl.textContent = "✅ Профиль получен";
      } catch (error) {
        statusEl.textContent =
          "❌ Не удалось получить профиль: " +
          (error?.message || String(error));
      } finally {
        userButton.disabled = false;
      }
    }

    userButton.addEventListener("click", getUser);

    initApp();
  </script>
</body>
</html>
